:root[lang="th"]{ --sans:"Noto Sans Thai","Noto Sans JP",system-ui,sans-serif }
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{background:transparent;color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.6;margin:0;padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%;min-height:100vh}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 420px at 85% -10%,var(--glow),transparent 70%),radial-gradient(700px 380px at -10% 0%,rgba(92,157,255,.07),transparent 70%)}
/* perforated-metal pattern (from the company site's top banner): staggered round holes, lit from the top right */
.perf{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:radial-gradient(circle at center,var(--perf) 0 2.6px,transparent 3.2px),radial-gradient(circle at center,var(--perf) 0 2.6px,transparent 3.2px);
  background-size:16px 14px;background-position:0 0,8px 7px;
  -webkit-mask-image:radial-gradient(120% 80% at 100% 0%,#000 0%,rgba(0,0,0,.45) 35%,transparent 70%);mask-image:radial-gradient(120% 80% at 100% 0%,#000 0%,rgba(0,0,0,.45) 35%,transparent 70%)}
.perf::after{content:"";position:absolute;inset:0;
  background-image:radial-gradient(circle at center,var(--perf-hot) 0 2.6px,transparent 3.4px),radial-gradient(circle at center,var(--perf-hot) 0 2.6px,transparent 3.4px);
  background-size:16px 14px;background-position:0 0,8px 7px;
  -webkit-mask-image:radial-gradient(560px 320px at 96% 0%,#000,transparent 75%);mask-image:radial-gradient(560px 320px at 96% 0%,#000,transparent 75%)}
.wrap{max-width:900px;margin:0 auto}
a{color:var(--accent)}
/* header: compact + sticky on inner pages, large hero on home */
header{position:sticky;top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:12px 0 12px;z-index:5;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{display:flex;align-items:center;gap:8px 12px;margin-bottom:10px;flex-wrap:wrap}
.logo{width:63px;height:23px;flex:0 0 auto;display:block;background:var(--logo) center/contain no-repeat}
.brand .bt{border-left:1px solid var(--line2);padding-left:12px}
.brand .bt{display:flex;flex-direction:column;min-width:0;flex:1 1 auto}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;line-height:1.3}
.brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.04em;line-height:1.3}
.brand h1 a{color:inherit;text-decoration:none}
.brand small{color:var(--muted);font-size:12px;display:none}
.tools{display:flex;gap:6px;margin-left:auto;align-items:center}
.tools button{font:inherit;font-size:12.5px;padding:5px 11px;border:1px solid var(--line2);background:var(--card);color:var(--fg);border-radius:999px;cursor:pointer}
.tools button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tools .editbtn.on{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.tools .themebtn{width:32px;height:30px;padding:0;display:flex;align-items:center;justify-content:center}
.seg{display:flex;border:1px solid var(--line2);border-radius:999px;padding:2px;background:var(--card)}
.seg button{border:0!important;padding:3px 10px!important;background:transparent}
.search{display:flex;gap:8px;position:relative}
.search .sicon{position:absolute;left:13px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{padding-left:40px!important}
.search input,.lock input,.field input,.field select,.field textarea{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:var(--card);color:var(--fg);width:100%}
.search input,.lock input{font-family:var(--mono)}
.search input::placeholder{font-family:var(--sans);color:var(--muted)}
.search input:focus,.lock input:focus,.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.btn,.search button,.lock button{font:inherit;padding:10px 18px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 60%,var(--accent2)));color:var(--accent-fg);font-weight:700;cursor:pointer;letter-spacing:.02em}
.btn.ghost{background:var(--card);color:var(--fg);border:1px solid var(--line2);font-weight:500}
.btn.small{font-size:13.5px;padding:7px 13px}
.btn:disabled{opacity:.55;cursor:default}
.hint{font-size:12px;color:var(--muted);margin:8px 0 0}
body.is-home header{position:relative;top:auto;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;border-bottom:0;padding:26px 0 6px}
body.is-home header::before{content:"";position:absolute;right:-6px;top:-4px;width:min(560px,88%);aspect-ratio:330/120;z-index:-1;background:var(--logo) right top/contain no-repeat;opacity:var(--mark-op);transform:rotate(-4deg);pointer-events:none}
body.is-home .brand{margin-bottom:22px}
body.is-home .logo{width:110px;height:40px}
body.is-home .brand .bt{padding-left:14px}
body.is-home .brand h1{font-size:28px}
body.is-home .brand small{display:block;font-size:13px;margin-top:2px}
body.is-home .search input{font-size:18px;padding:15px 14px 15px 46px!important;border-radius:14px;background:var(--card2);border-color:var(--line2)}
body.is-home .search .sicon{left:16px;width:20px;height:20px}
body.is-home .search button{padding:0 22px;border-radius:14px;font-size:16px}
main{padding-top:16px}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.lock{max-width:420px;margin:48px auto 0;text-align:center;padding:28px 22px}
.lock .logo{width:132px;height:48px;margin:0 auto 14px}
.lock h2{font-size:18px;margin:0 0 6px;justify-content:center}
.lock h2::before{display:none}
.lock p{color:var(--muted);font-size:14px;margin:0 0 16px}
.lock form{display:flex;gap:8px}
.err{color:var(--bad);font-size:13px;margin-top:8px;min-height:1.2em}
.okmsg{color:var(--ok);font-size:13px;margin:0 0 10px;background:var(--ok-bg);border-radius:8px;padding:8px 12px}
.title{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.title .no{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:.01em;overflow-wrap:anywhere;line-height:1.25}
.title .name{font-size:17px;font-weight:500}
.sub{color:var(--muted);font-size:13px;margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-size:12.5px;padding:4px 10px;border-radius:8px;background:var(--soft);color:var(--fg);border:1px solid var(--line)}
.chip b{font-weight:500;color:var(--muted);margin-right:5px}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--muted);margin-left:6px;vertical-align:middle;white-space:nowrap;border:1px solid transparent;font-weight:500}
.tag.black{background:#050607;color:#e9eef1;border-color:#3a434a}
.tag.clear{background:#d9ecff;color:#0c447c}
.tag.gray{background:#cfd3d6;color:#2a2e31}
.tag.issue,.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.action{background:var(--ok-bg);color:var(--ok)}
.tag.memo{background:var(--warn-bg);color:var(--warn)}
.tag.open{background:var(--warn-bg);color:var(--warn)}
.tag.scan,.tag.receipt,.tag.inspection{background:var(--soft);color:var(--accent)}
.tag.done{background:var(--ok-bg);color:var(--ok)}
.tag.st{background:transparent;border-color:var(--line2);color:var(--muted)}

/* ---------- crypto ---------- */
const KEYS = new Map();
async function keyFor(pass, salt, iter, usage){
  const id = usage+":"+salt+":"+iter;
  if(KEYS.has(id)) return KEYS.get(id);
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const k = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(salt), iterations:iter, hash:"SHA-256"}, km, {name:"AES-CBC", length:256}, false, [usage]);
  if(pass===PW) KEYS.set(id, k);
  return k;
}
async function decryptText(e, pass){
  const key = await keyFor(pass, e.salt, e.iter, "decrypt");
  const pt = await crypto.subtle.decrypt({name:"AES-CBC", iv:b64(e.iv)}, key, b64(e.ct));
  return new TextDecoder().decode(pt);
}
const decryptJSON = async (e, pass) => JSON.parse(await decryptText(e, pass));
async function encryptJSON(obj, pass){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(16));
  const key = await keyFor(pass, u8b64(salt), 100000, "encrypt");
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:"AES-CBC", iv}, key, new TextEncoder().encode(JSON.stringify(obj))));
  return {ct:u8b64(ct), iter:100000, iv:u8b64(iv), salt:u8b64(salt)};
}
async function fetchEnc(url, fresh){
  const r = await fetch(fresh ? `${url}${url.includes("?")?"&":"?"}t=${Date.now()}` : url, {cache: fresh ? "no-store" : "default"});
  if(r.status===404) return null;
  if(!r.ok) throw new Error("http "+r.status);
  return r.json();
}

function normalize(src){
  const C = [], P = [], I = [], E = [];
  const addC = c => { if(!C.find(x=>x.id===c.id)) C.push({...c}); };
  for(const s of src.sources){
    if(s.records){ /* legacy 図番カルテ v3 */
      FLOWSTEPS = s.flow || []; CAUTIONS = s.cautions || [];
      for(const r of s.records){
        const cid = /サンシン/.test(r.customer) ? "SANSHIN" : /AP ?Tech/i.test(r.customer) ? "APTECH" : (r.customer||"OTHER");
        addC(cid==="SANSHIN" ? {id:"SANSHIN", name:"サンシン", name_th:"ซันชิน", fullName:"サンシン（設計 VS Technology）"} : cid==="APTECH" ? {id:"APTECH", name:"AP Tech", name_th:"AP Tech", fullName:"AP Tech（設計 VS Technology）"} : {id:cid, name:cid});
        const sim = (r.similar||[]).map(x => Array.isArray(x) ? x : (x && x.value) ? x.value : x);
        P.push({ id:r.id, customer:cid, name:r.name, model:r.model, oldNo:r.oldNo, color:"黒", process:"FF Black", finish:r.finish, finish_th:r.finish_th, masking:r.masking, masking_th:r.masking_th,
          area_mm2:r.area, material:r.material, thickness:r.thickness, size:r.size, status:null, quote:r.quote, issueIds:[], legacyIssues:r.issues||[], issuesNote:r.issuesNote, issuesNote_th:r.issuesNote_th,
          similar:sim, flowSteps:true, docs: r.folder ? [{title:"図面 PDF", path:r.folder}] : [], received:r.received, rev:r.rev, sheet:r.sheet, areaFormula:r.areaFormula, notes:[] });
      }
    }
    (s.customers||[]).forEach(addC);
    (s.products||[]).forEach(p => { const i = P.findIndex(x=>x.id===p.id); if(i>=0) P[i] = {...P[i], ...p}; else if(p.name || p.customer) P.push({...p, issueIds:[...(p.issueIds||[])]}); });
    (s.issues||[]).forEach(x => I.push(x));
    (s.events||[]).forEach(x => E.push(x));
  }
  for(const c of (FIELD.customers||[])) addC(c);

async function gh(method, path, body){

}

  const w0 = src.width, h0 = src.height, s = Math.min(1, 1600/Math.max(w0,h0));
  const cv = document.createElement("canvas"); cv.width = Math.round(w0*s); cv.height = Math.round(h0*s);

}

/* Two-step button instead of confirm(): some in-app browsers suppress dialogs. First press arms it for 5 s. */
function armed(btn, label){
  if(btn.dataset.armed==="1") return true;
  const orig = btn.textContent; btn.dataset.armed = "1"; btn.textContent = label; btn.classList.add("armed");
  setTimeout(()=>{ if(btn.isConnected && btn.dataset.armed==="1"){ btn.dataset.armed = ""; btn.textContent = orig; btn.classList.remove("armed"); } }, 5000);
  return false;
}

/* One form for every place: product tabs, home ("register issue", pickProduct) and issue pages (parent = "i:<id>" / "e:<id>"). */
function wireForm(){
  const box = document.getElementById("entryForm"); if(!box || !FORM) return;
  const $ = id => document.getElementById(id);
  const files = FORM.files || (FORM.files = []);
  const prev = () => { $("fPrev").innerHTML = files.map(f=>`<img src="${URL.createObjectURL(f)}" alt="">`).join(""); };
  prev();
  const keep = () => { FORM.type = $("fType").value; FORM.date = $("fDate").value; FORM.lot = $("fLot").value; FORM.qty = $("fQty").value; FORM.text = $("fText").value;
    if($("fTitle")) FORM.title = $("fTitle").value; if($("fStatus")) FORM.status = $("fStatus").value; if($("fProd")) FORM.pid = $("fProd").value || null; };
  box.querySelectorAll("input,select,textarea").forEach(el => el.addEventListener("input", ()=>{ keep(); $("fErr").textContent = ""; }));
  $("fType").addEventListener("change", ()=>{ keep(); route(true); });
  $("fPhotos").addEventListener("change", e => { const add = [...e.target.files]; if(files.length + add.length > 4){ $("fErr").textContent = t("tooMany"); } files.push(...add.slice(0, 4-files.length)); e.target.value = ""; prev(); });
  $("fCancel").addEventListener("click", ()=>{ FORM = null; route(true); });
  $("fSave").addEventListener("click", async ()=>{
    keep(); const err = $("fErr"), btn = $("fSave"), f = FORM;
    if(f.pickProduct && !f.pid){ err.textContent = t("needProduct"); $("fProd").focus(); return; }
    if(!(f.text||"").trim()){ err.textContent = t("needText"); $("fText").focus(); return; }
    const p = byP[f.pid];
    btn.disabled = true; btn.textContent = t("saving"); err.textContent = "";
    try{
      const photoIds = [];
      for(const file of files){ const id = newId(); const data = await shrinkPhoto(file); await putFile(`${CONF.photos}${id}.enc.json`, JSON.stringify(await encryptJSON({type:"image/jpeg", data}, PW)), null, `photo: ${f.pid||f.parent||""} by ${EDIT.name}`); PHOTOS.set(id, `data:image/jpeg;base64,${data}`); photoIds.push(id); }
      const isIssue = f.type==="issue";
      const entry = {id:newId(), product:f.pid||null, customer:p ? p.customer : (f.customer||null), type:f.type, parent:f.parent||null, title:isIssue ? ((f.title||"").trim()||null) : null, status:isIssue ? (f.status||"未対応") : null,
        date:f.date||today(), lot:(f.lot||"").trim()||null, qty:f.qty?Number(f.qty):null, text:f.text.trim(), photos:photoIds, author:EDIT.name, createdAt:new Date().toISOString()};
      await updateField(d => d.entries.push(entry), `field: ${entry.type} ${entry.product||entry.parent||""} by ${EDIT.name}`);
      FORM = null; FLASH = t("saved");
      if(f.pickProduct){ location.hash = "#e/" + encodeURIComponent(entry.id); }
      else { if(!f.parent) TAB = entry.type==="memo" ? "memo" : "issues"; route(true); }
    }catch(x){ btn.disabled = false; btn.textContent = t("save"); err.textContent = t("saveFail") + x.message; }
  });
}

      <div class="chips"><span class="chip"><b>${esc(t("fProc"))}</b>${esc(procTx(procOf(p)))}</span>${chip("color", p.color?esc(colorTx(p.color)):"")}${chip("finish", p.finish?esc(tx(p,"finish")):"")}${chip("masking", p.masking?esc(tx(p,"masking")):"")}${chip("area", p.area_mm2!=null?`${fmt(p.area_mm2)} mm²`:"")}${chip("material", p.material?esc(p.material):"")}${chip("thickness", p.thickness?esc(p.thickness):"")}${chip("size", p.size?esc(p.size):"")}${chip("status", p.status?esc(statusTx(p.status)):"")}</div></div>
    <div class="tabs" role="tablist">${tabs.map(k=>`<button role="tab" data-tab="${k}" aria-selected="${k===TAB}">${esc(t("tabs")[k])}${counts[k]?`<span class="cnt">${counts[k]}</span>`:""}</button>`).join("")}</div>
    <div class="card" id="panel">${panels[TAB]()}</div>`;
  main.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{ TAB=b.dataset.tab; ls.set("karte.tab2",TAB); renderProduct(p); }));
  main.querySelectorAll("[data-add]").forEach(b=>b.addEventListener("click",()=>{ FORM = {pid:p.id, type:b.dataset.add, date:today(), files:[]}; renderProduct(p); const tx_ = document.getElementById("fText"); if(tx_) tx_.focus(); }));
  if(TAB==="flow") renderDocs();
  const ep = document.getElementById("editProd");
  if(ep) ep.addEventListener("click", ()=>{ PFORM = {isNew:false, pid:p.id, data:{...p, drawingPath:((p.docs||[])[0]||{}).path||""}}; renderProduct(p); });
  wireProductForm(); wireForm(); wireEntries(main); wireCopy(main);
}
const PF_LABEL = {name:"pfName", customer:"pfCust", model:"pfModel", oldNo:"pfOld", process:"pfProc", color:"pfColor", finish:"pfFinish", material:"pfMat", thickness:"pfThick", masking:"pfMask", area_mm2:"pfArea", status:"pfStatus", drawingPath:"pfPath", price:"priceT", size:"pfSize", finishSpec:"finishSpec"};
function changeLogHTML(pid){
  const l = (FIELD.productLog||[]).filter(x=>x.product===pid).sort(byNew);
  if(!l.length) return "";
  const v = x => x==null || x==="" ? "—" : esc(x);
  return `<h3>${esc(t("changeLog"))}</h3><ul class="list">${l.map(x=>`<li style="padding:8px 2px"><div class="meta">${fmtAt(x.at)} ・ ${esc(x.author)}${x.action==="add"?` ・ ${esc(t("addedField"))}`:""}</div>${Object.entries(x.changes||{}).filter(([k])=>JA() || k!=="price").map(([k,[a,b]])=>`<div style="font-size:13.5px">${esc(String(t(PF_LABEL[k]||k)).replace(/（.*?）|\(.*?\)/g,""))}：${x.action==="add"?"":`${v(a)} → `}${v(b)}</div>`).join("")}</li>`).join("")}</ul>`;
}
async function loadFlowDocs(){
  if(FLOWDOCS) return FLOWDOCS;
  if(!FLOW_LOADING){ FLOW_LOADING = fetchEnc(CONF.flow, false).then(e=>decryptJSON(e, PW)).then(d=>{ FLOWDOCS = d.docs; return FLOWDOCS; }).catch(err=>{ FLOW_LOADING=null; throw err; }); }
  return FLOW_LOADING;
}
function renderDocs(){
  loadFlowDocs().then(docs=>{ const b = document.getElementById("docs"); if(!b) return;
    b.innerHTML = docs.map((d,i)=>`<div class="doc"><h4>${esc(d.title[LANG]||d.title.ja)}</h4><div class="pages">${d.pages.map((p,j)=>`<div><div class="zoomwrap"><img src="${p}" alt="${esc(d.id)} p${j+1}" loading="lazy"></div><div class="pagebar"><span>${esc(t("page"))} ${j+1}/${d.pages.length}</span><button type="button" class="zoombtn">${esc(t("zoom"))}</button></div></div>`).join("")}</div></div>`).join("");
    b.querySelectorAll(".zoombtn").forEach(btn=>btn.addEventListener("click",()=>{ const img = btn.closest("div").previousElementSibling.querySelector("img"); const z = img.classList.toggle("zoomed"); btn.textContent = z ? t("unzoom") : t("zoom"); }));
  }).catch(()=>{ const b = document.getElementById("docs"); if(b) b.innerHTML = `<p class="note">${esc(t("loadFail"))}</p>`; });
}

/* ---------- routing ---------- */
let lastRoute = "";
function route(keepScroll){
  if(!DATA) return;
  const h = decodeURIComponent(location.hash.slice(1));
  document.body.classList.remove("is-home");
  if(h !== lastRoute){ FORM = null; PFORM = null; SFORM = null; if(lastRoute) TAB = "info"; lastRoute = h; if(!keepScroll) window.scrollTo(0,0); }
  const p = byP[h] || PRODUCTS.find(x=>x.oldNo===h) || (/[A-Z]$/i.test(h) ? byP[h.slice(0,-1)] : null);
  if(h.startsWith("c/") && byC[h.slice(2)]) renderCustomer(byC[h.slice(2)]);
  else if(h.startsWith("i/") && byI[h.slice(2)]) renderIssue(byI[h.slice(2)]);
  else if(h.startsWith("e/") && entryById(h.slice(2))) renderEntry(entryById(h.slice(2)));
  else if(p){ document.getElementById("q").value = ""; renderProduct(p); }
  else renderHome(document.getElementById("q").value);
  if(FLASH){ main.insertAdjacentHTML("afterbegin", `<p class="okmsg">${esc(FLASH)}</p>`); FLASH = ""; }
}
document.getElementById("form").addEventListener("submit",e=>{ e.preventDefault(); const v=document.getElementById("q").value.trim(); const exact=PRODUCTS.find(p=>p.id.toLowerCase()===v.toLowerCase()); if(exact){ location.hash=encodeURIComponent(exact.id); } else { if(location.hash) history.replaceState(null,"",location.pathname); lastRoute=""; renderHome(v); } });
document.getElementById("q").addEventListener("input",e=>{ if(location.hash){ history.replaceState(null,"",location.pathname); lastRoute=""; } renderHome(e.target.value); });
window.addEventListener("hashchange",()=>route());
TAB = ls.get("karte.tab2") || "info";
(async()=>{ applyChrome(); const saved = ls.get("karte.pw");
  if(saved){ try{ await unlock(saved); return; }catch(e){ ls.del("karte.pw"); } }
  renderLock(""); })();
</script>
</body>
