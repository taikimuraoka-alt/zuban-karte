<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>製品カルテ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: one column, phone first. Lock screen → header (search, language, edit) → home / customer / product / issue (from #hash). */
:root{
  --bg:#f6f7f4; --fg:#1d2420; --muted:#5d665f; --line:#d7dbd3; --card:#ffffff;
  --accent:#1f5f4a; --accent-fg:#ffffff; --soft:#e7efe9; --warn:#9a4a00; --warn-bg:#fff3e2; --bad:#9b1c1c; --bad-bg:#fde9e9; --ok:#1d6b35; --ok-bg:#e6f4ea;
  --sans:"Noto Sans JP","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#141916; --fg:#e8ebe6; --muted:#a3aca5; --line:#2d3630; --card:#1c231f; --accent:#7fc9a9; --accent-fg:#0d1a14; --soft:#1f2d26; --warn:#ffb974; --warn-bg:#2d2416; --bad:#ff9b9b; --bad-bg:#331a1a; --ok:#8fd6a3; --ok-bg:#16291c; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#141916; --fg:#e8ebe6; --muted:#a3aca5; --line:#2d3630; --card:#1c231f; --accent:#7fc9a9; --accent-fg:#0d1a14; --soft:#1f2d26; --warn:#ffb974; --warn-bg:#2d2416; --bad:#ff9b9b; --bad-bg:#331a1a; --ok:#8fd6a3; --ok-bg:#16291c; color-scheme:dark }
:root[lang="th"]{ --sans:"Noto Sans Thai","Noto Sans JP",system-ui,sans-serif }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.6;margin:0;padding-block:0 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:12px 0 10px;z-index:5;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{display:flex;align-items:center;gap:8px 10px;margin-bottom:8px;flex-wrap:wrap}
.brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.02em}
.brand h1 a{color:inherit;text-decoration:none}
.brand small{color:var(--muted);font-size:12px;flex:1 1 auto}
.tools{display:flex;gap:4px;margin-left:auto;align-items:center}
.tools button{font:inherit;font-size:13px;padding:5px 10px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px}
.tools button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.tools .editbtn.on{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.search{display:flex;gap:8px}
.search input,.lock input,.field input,.field select,.field textarea{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);width:100%}
.search input,.lock input{font-family:var(--mono)}
.search input:focus,.lock input:focus,.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.btn,.search button,.lock button{font:inherit;padding:10px 16px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-fg);font-weight:500;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.btn.small{font-size:13.5px;padding:7px 12px}
.btn:disabled{opacity:.55;cursor:default}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
main{padding-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.lock{max-width:420px;margin:48px auto 0;text-align:center}
.lock h2{font-size:18px;margin:0 0 6px}
.lock p{color:var(--muted);font-size:14px;margin:0 0 14px}
.lock form{display:flex;gap:8px}
.err{color:var(--bad);font-size:13px;margin-top:8px;min-height:1.2em}
.okmsg{color:var(--ok);font-size:13px;margin-top:8px}
.title{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.title .no{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:.01em;overflow-wrap:anywhere}
.title .name{font-size:17px;font-weight:500}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--fg)}
.chip b{font-weight:500;color:var(--muted);margin-right:4px}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--muted);margin-left:6px;vertical-align:middle;white-space:nowrap}
.tag.black{background:#2b2f2c;color:#f2f2ee}
.tag.clear{background:#dcefff;color:#0c447c}
.tag.gray{background:#d3d1c7;color:#2c2c2a}
.tag.issue{background:var(--bad-bg);color:var(--bad)}
.tag.action{background:var(--ok-bg);color:var(--ok)}
.tag.memo{background:var(--warn-bg);color:var(--warn)}
.tag.open{background:var(--warn-bg);color:var(--warn)}
.tag.done{background:var(--ok-bg);color:var(--ok)}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:4px 0 10px;padding-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs button{flex:0 0 auto;font:inherit;font-size:15px;padding:9px 14px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.tabs button .cnt{font-size:11px;margin-left:5px;opacity:.8}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.filters button{font:inherit;font-size:13px;padding:4px 11px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px}
.filters button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
h2{font-size:16px;margin:0 0 8px;text-wrap:balance}
h3{font-size:13px;margin:16px 0 6px;color:var(--muted);letter-spacing:.04em;font-weight:500}
.kv{display:grid;grid-template-columns:minmax(90px,32%) 1fr;gap:6px 12px;font-size:14.5px;margin:0}
.kv a{color:var(--accent)}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.price{font-family:var(--mono);font-size:28px;font-weight:600;color:var(--accent)}
.price small{font-size:13px;font-weight:400;color:var(--muted);font-family:var(--sans)}
table{border-collapse:collapse;width:100%;font-size:14px}
.tblwrap{overflow-x:auto}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12.5px}
td.num,th.num{text-align:right}
.note{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:14px;margin:0}
.bul{margin:0;padding-left:18px;font-size:14.5px}
.bul li{margin:2px 0}
.flow{list-style:none;margin:0;padding:0;counter-reset:step}
.flow li{position:relative;padding:0 0 14px 34px;counter-increment:step}
.flow li::before{content:counter(step);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--mono)}
.flow li::after{content:"";position:absolute;left:11px;top:26px;bottom:0;width:2px;background:var(--line)}
.flow li:last-child::after{display:none}
.flow .st{font-weight:500}.flow .sd{font-size:13.5px;color:var(--muted)}
.docs{display:flex;flex-direction:column;gap:14px}
.doc h4{font-size:14px;margin:0 0 6px;font-weight:500}
.doc .pages{display:flex;flex-direction:column;gap:8px}
.doc img{width:100%;max-width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff;display:block}
.pagebar{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);margin-top:4px}
.pagebar button{font:inherit;font-size:12.5px;padding:4px 10px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px}
.zoomwrap{overflow:auto;max-height:80vh;border-radius:6px}
.zoomwrap img.zoomed{width:200%;max-width:none}
.list{list-style:none;margin:0;padding:0}
.list li{border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list a{display:block;padding:11px 2px;color:inherit;text-decoration:none}
.list a:hover,.list a:focus-visible{background:var(--soft);outline:none}
.list .no{font-family:var(--mono);font-weight:600}
.list .meta{font-size:13px;color:var(--muted)}
.cust{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.cust a{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:inherit;text-decoration:none;background:var(--card)}
.cust a:hover,.cust a:focus-visible{border-color:var(--accent);outline:none}
.cust .nm{font-weight:700;font-size:16px}
.cust .meta{font-size:12.5px;color:var(--muted)}
.path{font-family:var(--mono);font-size:12px;overflow-wrap:anywhere;background:var(--soft);padding:8px 10px;border-radius:6px}
.copy{font:inherit;font-size:12.5px;padding:4px 10px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;margin-top:6px}
.doclist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.back{display:inline-block;margin-bottom:10px;color:var(--accent);text-decoration:none;font-size:15px}
.empty{color:var(--muted);text-align:center;padding:20px 0;margin:0}
.loading{color:var(--muted);font-size:14px;padding:10px 0}
.entry{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.entry.deleted{opacity:.5}
.entry.deleted .txt{text-decoration:line-through}
.entry .head{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:13px;color:var(--muted)}
.entry .head .tag{margin-left:0}
.entry .txt{white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0 0;font-size:15px}
.entry .prod{font-family:var(--mono);font-size:13px;color:var(--accent);text-decoration:none}
.entry .more{margin-left:auto;font-size:13px;color:var(--accent);text-decoration:none;white-space:nowrap}
.entry .etitle{font-weight:500;margin-top:6px}
.txtlink{color:inherit;text-decoration:none}
.txtlink:hover{text-decoration:underline}
.bimgs{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.bimgs img{width:100%;border-radius:8px;border:1px solid var(--line);display:block}
.bimgs .wait{font-size:13px;color:var(--muted);background:var(--soft);border-radius:8px;padding:18px;text-align:center}
.fgroup{margin:8px 0 2px}
.flabel{display:block;font-size:12.5px;color:var(--muted);margin-bottom:2px}
.statusbox{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px;align-items:end;margin-top:10px}
.statusbox .field{margin-bottom:0}
@media (max-width:520px){ .statusbox{grid-template-columns:1fr} }
.photos{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.photos .ph{width:88px;height:88px;border-radius:6px;border:1px solid var(--line);background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);overflow:hidden;padding:0;cursor:pointer}
.photos .ph img{width:100%;height:100%;object-fit:cover;display:block}
.bigphoto{margin-top:8px}
.bigphoto img{width:100%;border-radius:8px;border:1px solid var(--line);display:block}
.form{border:1px solid var(--accent);border-radius:10px;padding:12px;margin-bottom:12px;background:var(--card)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-size:13.5px;color:var(--muted)}
.field textarea{min-height:110px;resize:vertical;font-family:var(--sans)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.addbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.previews{display:flex;gap:6px;flex-wrap:wrap}
.previews img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.linkbtn{font:inherit;font-size:12.5px;color:var(--muted);background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}
.linkbtn.armed{color:var(--bad);font-weight:500}
.jaonly{font-size:11.5px;color:var(--muted)}
footer{color:var(--muted);font-size:12px;margin-top:20px;text-align:center}
@media (max-width:420px){ .row2{grid-template-columns:1fr} .title .no{font-size:20px} }
@media (prefers-reduced-motion:no-preference){ .card{animation:in .18s ease-out} @keyframes in{from{opacity:.6;transform:translateY(3px)}to{opacity:1;transform:none}} }
</style>
</head>

/* ---------- crypto ---------- */
const KEYS = new Map();
async function keyFor(pass, salt, iter, usage){
  const id = usage+":"+salt+":"+iter;
  if(KEYS.has(id)) return KEYS.get(id);
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const k = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(salt), iterations:iter, hash:"SHA-256"}, km, {name:"AES-CBC", length:256}, false, [usage]);
  if(pass===PW) KEYS.set(id, k);
  return k;
}
async function decryptText(e, pass){
  const key = await keyFor(pass, e.salt, e.iter, "decrypt");
  const pt = await crypto.subtle.decrypt({name:"AES-CBC", iv:b64(e.iv)}, key, b64(e.ct));
  return new TextDecoder().decode(pt);
}
const decryptJSON = async (e, pass) => JSON.parse(await decryptText(e, pass));
async function encryptJSON(obj, pass){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(16));
  const key = await keyFor(pass, u8b64(salt), 100000, "encrypt");
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:"AES-CBC", iv}, key, new TextEncoder().encode(JSON.stringify(obj))));
  return {ct:u8b64(ct), iter:100000, iv:u8b64(iv), salt:u8b64(salt)};
}
async function fetchEnc(url, fresh){
  const r = await fetch(fresh ? `${url}${url.includes("?")?"&":"?"}t=${Date.now()}` : url, {cache: fresh ? "no-store" : "default"});
  if(r.status===404) return null;
  if(!r.ok) throw new Error("http "+r.status);
  return r.json();
}

/* Base data (DATA.sources, merged in order) + overlays written from the site (FIELD.customers / FIELD.products). Rebuilt whenever FIELD changes. */
function normalize(src){
  const C = [], P = [], I = [], E = [];
  const addC = c => { if(!C.find(x=>x.id===c.id)) C.push({...c}); };
  for(const s of src.sources){
    if(s.records){ /* legacy 図番カルテ v3 */
      FLOWSTEPS = s.flow || []; CAUTIONS = s.cautions || [];
      for(const r of s.records){
        const cid = /サンシン/.test(r.customer) ? "SANSHIN" : /AP ?Tech/i.test(r.customer) ? "APTECH" : (r.customer||"OTHER");
        addC(cid==="SANSHIN" ? {id:"SANSHIN", name:"サンシン", name_th:"ซันชิน", fullName:"サンシン（設計 VS Technology）"} : cid==="APTECH" ? {id:"APTECH", name:"AP Tech", name_th:"AP Tech", fullName:"AP Tech（設計 VS Technology）"} : {id:cid, name:cid});
        const sim = (r.similar||[]).map(x => Array.isArray(x) ? x : (x && x.value) ? x.value : x);
        P.push({ id:r.id, customer:cid, name:r.name, model:r.model, oldNo:r.oldNo, color:"黒", process:"FF Black", finish:r.finish, finish_th:r.finish_th, masking:r.masking, masking_th:r.masking_th,
          area_mm2:r.area, material:r.material, thickness:r.thickness, size:r.size, status:null, quote:r.quote, issueIds:[], legacyIssues:r.issues||[], issuesNote:r.issuesNote, issuesNote_th:r.issuesNote_th,
          similar:sim, flowSteps:true, docs: r.folder ? [{title:"図面 PDF", path:r.folder}] : [], received:r.received, rev:r.rev, sheet:r.sheet, areaFormula:r.areaFormula, notes:[] });
      }
    }
    (s.customers||[]).forEach(addC);
    (s.products||[]).forEach(p => { const i = P.findIndex(x=>x.id===p.id); if(i>=0) P[i] = {...P[i], ...p}; else if(p.name || p.customer) P.push({...p, issueIds:[...(p.issueIds||[])]}); });
    (s.issues||[]).forEach(x => I.push(x));
    (s.events||[]).forEach(x => E.push(x));
  }
  for(const c of (FIELD.customers||[])) addC(c);
  for(const o of (FIELD.products||[])){
    const i = P.findIndex(x=>x.id===o.id), f = {...o.fields};
    const base = i>=0 ? P[i] : {id:o.id, issueIds:[], docs:[], notes:[], addedInField:true};
    const merged = {...base, ...f};
    if(f.drawingPath) merged.docs = [{title:"図面 PDF", path:f.drawingPath}, ...(base.docs||[]).filter(d=>d.path!==f.drawingPath)];
    if(i>=0) P[i] = merged; else P.push(merged);
  }
  const nOf = id => P.filter(p=>p.customer===id).length;
  C.sort((a,b)=>nOf(b.id)-nOf(a.id));
  CUSTOMERS = C; PRODUCTS = P; ISSUES = I; EVENTS = E.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  byP = Object.fromEntries(P.map(p=>[p.id,p])); byC = Object.fromEntries(C.map(c=>[c.id,c])); byI = Object.fromEntries(I.map(i=>[i.id,i]));
  for(const p of P) p.issueIds = [...(p.issueIds||[])];
  for(const i of I) for(const pid of (i.products||[])) if(byP[pid] && !byP[pid].issueIds.includes(i.id)) byP[pid].issueIds.push(i.id);
}

function lock(){ ls.del("karte.pw"); ls.del("karte.editpw"); PW=null; DATA=null; EDIT=null; FIELD={entries:[]}; FLOWDOCS=null; FLOW_LOADING=null; KEYS.clear(); renderLock(""); }
async function unlock(pw){
  if(!(window.crypto && crypto.subtle)) throw new Error("no webcrypto");
  const e = await fetchEnc(CONF.data, true); if(!e) throw new Error("no data");
  const data = await decryptJSON(e, pw);
  PW = pw; DATA = data; normalize(data);
  document.getElementById("form").hidden = false; applyChrome(); route();
  await loadField(); route(true);
  const ep = ls.get("karte.editpw"), en = ls.get("karte.editname"); if(ep && en) startEdit(ep, en, true).catch(()=>{});
}

/* ---------- edit mode ---------- */
async function startEdit(epw, name, quiet){
  const e = await fetchEnc(CONF.editkey, true);
  if(!e) throw new Error("notReady");
  let k; try{ k = await decryptJSON(e, epw); }catch(_){ throw new Error("editWrong"); }
  const r = await fetch(`https://api.github.com/repos/${k.owner}/${k.repo}`, {headers:{Authorization:`Bearer ${k.token}`, Accept:"application/vnd.github+json"}});
  if(!r.ok) throw new Error("tokenBad");
  EDIT = {token:k.token, owner:k.owner, repo:k.repo, branch:k.branch||"main", name};
  applyChrome(); if(!quiet) route();
}

    catch(x){ err.textContent = t(["notReady","editWrong","tokenBad"].includes(x.message) ? x.message : "tokenBad"); }
  });
}
async function gh(method, path, body){
  const url = `https://api.github.com/repos/${EDIT.owner}/${EDIT.repo}/contents/${CONF.repoDir}${path}` + (method==="GET" ? `?ref=${EDIT.branch}&t=${Date.now()}` : "");
  const r = await fetch(url, {method, headers:{Authorization:`Bearer ${EDIT.token}`, Accept:"application/vnd.github+json", "Content-Type":"application/json"}, body: body ? JSON.stringify(body) : undefined, cache:"no-store"});
  if(method==="GET" && r.status===404) return null;
  if(!r.ok){ const e = new Error(`GitHub ${r.status}`); e.status = r.status; throw e; }
  return r.json();
}
const ghText = j => new TextDecoder().decode(b64(j.content.replace(/\s/g,"")));
async function putFile(path, text, sha, message){
  return gh("PUT", path, {message, content:u8b64(new TextEncoder().encode(text)), branch:EDIT.branch, ...(sha?{sha}:{})});
}
async function updateField(mutate, message){
  for(let attempt=0; attempt<4; attempt++){
    const cur = await gh("GET", CONF.field);
    const data = cur ? await decryptJSON(JSON.parse(ghText(cur)), PW) : {entries:[]};
    if(!data.entries) data.entries = [];
    mutate(data);
    try{ await putFile(CONF.field, JSON.stringify(await encryptJSON(data, PW)), cur && cur.sha, message); FIELD = data; rebuild(); return; }
    catch(e){ if(e.status!==409 && e.status!==422) throw e; }
  }
  throw new Error("conflict");
}
async function shrinkPhoto(file){
  let src;
  try{ src = await createImageBitmap(file); }
  catch(_){ src = await new Promise((ok,ng)=>{ const im = new Image(); im.onload = ()=>ok(im); im.onerror = ng; im.src = URL.createObjectURL(file); }); }
  const w0 = src.width, h0 = src.height, s = Math.min(1, 1600/Math.max(w0,h0));
  const cv = document.createElement("canvas"); cv.width = Math.round(w0*s); cv.height = Math.round(h0*s);
  cv.getContext("2d").drawImage(src, 0, 0, cv.width, cv.height);
  const blob = await new Promise(ok=>cv.toBlob(ok, "image/jpeg", 0.72));
  return u8b64(new Uint8Array(await blob.arrayBuffer()));
}
const newId = () => `${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`;

/* ---------- photos ---------- */
const PHOTOS = new Map();
async function photoURL(id){
  if(PHOTOS.has(id)) return PHOTOS.get(id);
  let e = null;
  try{ e = await fetchEnc(`${CONF.photos}${id}.enc.json`, false); }catch(_){}
  if(!e && EDIT){ try{ const j = await gh("GET", `${CONF.photos}${id}.enc.json`); if(j && j.content) e = JSON.parse(ghText(j)); }catch(_){} }
  if(!e) return null;
  const p = await decryptJSON(e, PW);
  const url = `data:${p.type||"image/jpeg"};base64,${p.data}`; PHOTOS.set(id, url); return url;
}
function hydratePhotos(root){
  root.querySelectorAll(".ph[data-photo]").forEach(async btn => {
    const id = btn.dataset.photo; const url = await photoURL(id).catch(()=>null);
    if(url){ btn.innerHTML = `<img src="${url}" alt="">`; btn.addEventListener("click", ()=>{ const box = btn.closest(".entry").querySelector(".bigphoto"); if(box.dataset.cur===id){ box.innerHTML=""; box.dataset.cur=""; } else { box.innerHTML = `<img src="${url}" alt="">`; box.dataset.cur=id; } }); }
    else btn.textContent = t("photoWait");
  });
}

/* Two-step button instead of confirm(): some in-app browsers suppress dialogs. First press arms it for 5 s. */
function armed(btn, label){
  if(btn.dataset.armed==="1") return true;
  const orig = btn.textContent; btn.dataset.armed = "1"; btn.textContent = label; btn.classList.add("armed");
  setTimeout(()=>{ if(btn.isConnected && btn.dataset.armed==="1"){ btn.dataset.armed = ""; btn.textContent = orig; btn.classList.remove("armed"); } }, 5000);
  return false;
}

}

/* "製品を探す": one-tap facets (company, process, material, masking, status). Options only show values that exist. */
function findCard(){
  const pool = PRODUCTS;
  const opts = (key, vals, label) => vals.length ? `<div class="fgroup"><span class="flabel">${esc(label)}</span><div class="filters">${vals.map(([v,txt])=>`<button type="button" data-f="${key}" data-v="${esc(v)}" aria-pressed="${FILT[key]===v}">${esc(txt)}</button>`).join("")}</div></div>` : "";
  const uniq = arr => [...new Set(arr)];
  const custs = CUSTOMERS.filter(c=>pool.some(p=>p.customer===c.id)).map(c=>[c.id, tx(c,"name")]);
  const procs = PROCS.filter(x=>pool.some(p=>procOf(p)===x)).map(x=>[x, procTx(x)]);
  const mats = uniq(pool.map(p=>matOf(p)||"?")).sort((a,b)=>a==="?"?1:b==="?"?-1:a.localeCompare(b)).map(m=>[m, m==="?"?t("unknownMat"):m]);
  const stats = ["量産","サンプル","見積中"].filter(s=>pool.some(p=>p.status===s)).map(s=>[s, statusTx(s)]);
  const hits = filtActive() ? pool.filter(matchFilt) : [];
  const pf = (PFORM && PFORM.isNew) ? productFormHTML() : (EDIT ? `<div class="addbar"><button type="button" class="btn small ghost" id="addProd">${esc(t("addProduct"))}</button></div>` : "");
  return `<div class="card" id="find"><h2>${esc(t("find"))}</h2>${pf}
    ${opts("cust", custs, t("fCust"))}${opts("proc", procs, t("fProc"))}${opts("mat", mats, t("fMat"))}${opts("mask", [["yes",t("maskYes")],["no",t("maskNo")]], t("fMask"))}${opts("status", stats, t("fStat"))}
    ${filtActive()?`<div class="actions" style="margin:6px 0 4px"><span class="sub">${esc(t("nHit")(hits.length))}</span><button type="button" class="linkbtn" id="fClear">${esc(t("clear"))}</button></div><ul class="list">${hits.map(productItem).join("")}</ul>`:""}</div>`;
}

    const ps = PRODUCTS.filter(p => words.every(w => hay(p).includes(w)) && matchFilt(p));
    const is = ISSUES.filter(i => words.every(w => [i.id, i.title, i.title_th, i.customer, (i.products||[]).join(" ")].join(" ").toLowerCase().includes(w)));
    main.innerHTML = `<div class="card"><h2>${esc(t("hitN")(ps.length+is.length))}</h2>${filtActive()?`<p class="sub" style="margin:0 0 6px">${esc(t("find"))}: ${esc(Object.values(FILT).filter(Boolean).map(v=>v==="yes"?t("fMask")+" "+t("maskYes"):v==="no"?t("fMask")+" "+t("maskNo"):v).join(" / "))} <button type="button" class="linkbtn" id="fClear">${esc(t("clear"))}</button></p>`:""}${ps.length?`<ul class="list">${ps.map(productItem).join("")}</ul>`:""}${is.length?`<h3>${esc(t("issues"))}</h3><ul class="list">${is.map(issueItem).join("")}</ul>`:""}${(ps.length+is.length)?"":`<p class="empty">${esc(t("none"))}</p>`}</div>`;

    return;

  const recent = FIELD.entries.filter(e=>!e.deleted).sort(byNew).slice(0,8);

  const regForm = (FORM && FORM.pickProduct) ? formHTML() : (EDIT ? `<div class="addbar"><button type="button" class="btn small" id="regIssue">${esc(t("registerIssue"))}</button></div>` : "");

  if(rb) rb.addEventListener("click", ()=>{ FORM = {pid:null, pickProduct:true, type:"issue", date:today(), files:[]}; renderHome(""); });
  wireFind(); wireForm(); wireEntries(main);
}

      ${(p.similar||[]).length?`<h3>${esc(t("similar"))}</h3><ul class="list">${p.similar.map(s=>byP[s[0]]?productItem(byP[s[0]]).replace("</a></li>", `<div class="meta">${esc(JA()?s[1]:(s[2]||s[1]))}</div></a></li>`):"").join("")}</ul>`:""}
      ${(!JA() && !(p.similar||[]).length)?`<dl class="kv"><dt>${esc(t("customer"))}</dt><dd>${esc(tx(c,"name"))}</dd><dt>${esc(t("model"))}</dt><dd>${esc(p.model||"—")}</dd><dt>${esc(t("chips").status)}</dt><dd>${esc(statusTx(p.status)||"—")}</dd></dl>`:""}`,
    flow: () => `${p.flowSteps && FLOWSTEPS.length?`<h2>${esc(t("flowTitle"))}</h2><p class="sub" style="margin-bottom:10px">${esc(t("flowSub"))}</p><ol class="flow">${FLOWSTEPS.map(s=>`<li><div class="st">${esc(tx(s,"st"))}</div><div class="sd">${esc(tx(s,"sd"))}</div></li>`).join("")}</ol>`:""}
      <h3>${esc(t("docsTitle"))}</h3><p class="sub" style="margin-bottom:8px">${esc(t("docsSub"))}</p><div id="docs" class="docs"><div class="loading">${esc(t("loading"))}</div></div>`,
    issues: () => `${formFor(["issue","action"])}
      ${masterIss.length?`<h3 style="margin-top:0">${esc(t("issueMaster"))}</h3><ul class="list">${masterIss.map(issueItem).join("")}</ul>`:""}
      ${(p.legacyIssues||[]).length?`<ul class="bul">${p.legacyIssues.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
      <h3>${esc(t("fieldRec"))}</h3>${issEnt.length?issEnt.map(e=>entryCard(e,false)).join(""):`<p class="empty">${esc(p.issuesNote ? tx(p,"issuesNote") : t("noIssue"))}</p>`}`,
    memo: () => `${formFor(["memo"])}${memoEnt.length?memoEnt.map(e=>entryCard(e,false)).join(""):`<p class="empty">${esc(t("noIssue"))}</p>`}
      ${(p.flowSteps && CAUTIONS.length)?`<h3>${esc(t("cautions"))}</h3><ul class="bul">${CAUTIONS.map(x=>`<li>${esc(JA()?x.ja:x.th)}</li>`).join("")}</ul>`:""}`,
    docs: () => `${(p.received||p.rev||p.areaFormula)?`<dl class="kv" style="margin-bottom:12px">${p.received?`<dt>${esc(t("received"))}</dt><dd>${esc(p.received)}</dd>`:""}${p.rev?`<dt>${esc(t("rev"))}</dt><dd>${esc(p.rev)}</dd>`:""}${p.areaFormula?`<dt>${esc(t("areaF"))}</dt><dd class="num">${esc(p.areaFormula)}</dd>`:""}</dl>`:""}${docList(p.docs)}${changeLogHTML(p.id)}`
  };
  if(!panels[TAB]) TAB = "info";
  const tabs = ["info","flow","issues","memo","docs"];
  main.innerHTML = `<a class="back" href="#c/${encodeURIComponent(p.customer)}">${esc(t("back"))} ${esc(tx(c,"name"))}</a>
    <div class="card"><div class="title"><span class="no">${esc(p.id)}</span><span class="name">${esc(tx(p,"name"))}</span></div>
      <div class="sub">${esc(tx(c,"name"))}${p.model?` ・ ${esc(t("model"))} ${esc(p.model)}`:""}${p.oldNo?` ・ ${esc(t("old"))} ${esc(p.oldNo)}`:""}${p.addedInField?`<span class="tag memo">${esc(t("addedField"))}</span>`:""}</div>
      <div class="chips"><span class="chip"><b>${esc(t("fProc"))}</b>${esc(procTx(procOf(p)))}</span>${chip("color", p.color?esc(colorTx(p.color)):"")}${chip("finish", p.finish?esc(tx(p,"finish")):"")}${chip("masking", p.masking?esc(tx(p,"masking")):"")}${chip("area", p.area_mm2!=null?`${fmt(p.area_mm2)} mm²`:"")}${chip("material", p.material?esc(p.material):"")}${chip("thickness", p.thickness?esc(p.thickness):"")}${chip("size", p.size?esc(p.size):"")}${chip("status", p.status?esc(statusTx(p.status)):"")}</div></div>
    <div class="tabs" role="tablist">${tabs.map(k=>`<button role="tab" data-tab="${k}" aria-selected="${k===TAB}">${esc(t("tabs")[k])}${counts[k]?`<span class="cnt">${counts[k]}</span>`:""}</button>`).join("")}</div>
    <div class="card" id="panel">${panels[TAB]()}</div>`;
  main.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{ TAB=b.dataset.tab; ls.set("karte.tab2",TAB); renderProduct(p); }));
  main.querySelectorAll("[data-add]").forEach(b=>b.addEventListener("click",()=>{ FORM = {pid:p.id, type:b.dataset.add, date:today(), files:[]}; renderProduct(p); const tx_ = document.getElementById("fText"); if(tx_) tx_.focus(); }));
  if(TAB==="flow") renderDocs();
  const ep = document.getElementById("editProd");
  if(ep) ep.addEventListener("click", ()=>{ PFORM = {isNew:false, pid:p.id, data:{...p, drawingPath:((p.docs||[])[0]||{}).path||""}}; renderProduct(p); });
  wireProductForm(); wireForm(); wireEntries(main); wireCopy(main);
}
const PF_LABEL = {name:"pfName", customer:"pfCust", model:"pfModel", oldNo:"pfOld", process:"pfProc", color:"pfColor", finish:"pfFinish", material:"pfMat", thickness:"pfThick", masking:"pfMask", area_mm2:"pfArea", status:"pfStatus", drawingPath:"pfPath"};
function changeLogHTML(pid){
  const l = (FIELD.productLog||[]).filter(x=>x.product===pid).sort(byNew);
  if(!l.length) return "";
  const v = x => x==null || x==="" ? "—" : esc(x);
  return `<h3>${esc(t("changeLog"))}</h3><ul class="list">${l.map(x=>`<li style="padding:8px 2px"><div class="meta">${fmtAt(x.at)} ・ ${esc(x.author)}${x.action==="add"?` ・ ${esc(t("addedField"))}`:""}</div>${Object.entries(x.changes||{}).map(([k,[a,b]])=>`<div style="font-size:13.5px">${esc(String(t(PF_LABEL[k]||k)).replace(/（.*?）|\(.*?\)/g,""))}：${x.action==="add"?"":`${v(a)} → `}${v(b)}</div>`).join("")}</li>`).join("")}</ul>`;
}
async function loadFlowDocs(){
  if(FLOWDOCS) return FLOWDOCS;
  if(!FLOW_LOADING){ FLOW_LOADING = fetchEnc(CONF.flow, false).then(e=>decryptJSON(e, PW)).then(d=>{ FLOWDOCS = d.docs; return FLOWDOCS; }).catch(err=>{ FLOW_LOADING=null; throw err; }); }
  return FLOW_LOADING;
}
function renderDocs(){
  loadFlowDocs().then(docs=>{ const b = document.getElementById("docs"); if(!b) return;
    b.innerHTML = docs.map((d,i)=>`<div class="doc"><h4>${esc(d.title[LANG]||d.title.ja)}</h4><div class="pages">${d.pages.map((p,j)=>`<div><div class="zoomwrap"><img src="${p}" alt="${esc(d.id)} p${j+1}" loading="lazy"></div><div class="pagebar"><span>${esc(t("page"))} ${j+1}/${d.pages.length}</span><button type="button" class="zoombtn">${esc(t("zoom"))}</button></div></div>`).join("")}</div></div>`).join("");
    b.querySelectorAll(".zoombtn").forEach(btn=>btn.addEventListener("click",()=>{ const img = btn.closest("div").previousElementSibling.querySelector("img"); const z = img.classList.toggle("zoomed"); btn.textContent = z ? t("unzoom") : t("zoom"); }));
  }).catch(()=>{ const b = document.getElementById("docs"); if(b) b.innerHTML = `<p class="note">${esc(t("loadFail"))}</p>`; });
}

/* ---------- routing ---------- */
let lastRoute = "";
function route(keepScroll){
  if(!DATA) return;
  const h = decodeURIComponent(location.hash.slice(1));
  if(h !== lastRoute){ FORM = null; PFORM = null; if(lastRoute) TAB = "info"; lastRoute = h; if(!keepScroll) window.scrollTo(0,0); }
  const p = byP[h] || PRODUCTS.find(x=>x.oldNo===h) || (/[A-Z]$/i.test(h) ? byP[h.slice(0,-1)] : null);
  if(h.startsWith("c/") && byC[h.slice(2)]) renderCustomer(byC[h.slice(2)]);
  else if(h.startsWith("i/") && byI[h.slice(2)]) renderIssue(byI[h.slice(2)]);
  else if(h.startsWith("e/") && entryById(h.slice(2))) renderEntry(entryById(h.slice(2)));
  else if(p){ document.getElementById("q").value = ""; renderProduct(p); }
  else renderHome(document.getElementById("q").value);
  if(FLASH){ main.insertAdjacentHTML("afterbegin", `<p class="okmsg">${esc(FLASH)}</p>`); FLASH = ""; }
}
document.getElementById("form").addEventListener("submit",e=>{ e.preventDefault(); const v=document.getElementById("q").value.trim(); const exact=PRODUCTS.find(p=>p.id.toLowerCase()===v.toLowerCase()); if(exact){ location.hash=encodeURIComponent(exact.id); } else { if(location.hash) history.replaceState(null,"",location.pathname); lastRoute=""; renderHome(v); } });
document.getElementById("q").addEventListener("input",e=>{ if(location.hash){ history.replaceState(null,"",location.pathname); lastRoute=""; } renderHome(e.target.value); });
window.addEventListener("hashchange",()=>route());
TAB = ls.get("karte.tab2") || "info";
(async()=>{ applyChrome(); const saved = ls.get("karte.pw");
  if(saved){ try{ await unlock(saved); return; }catch(e){ ls.del("karte.pw"); } }
  renderLock(""); })();
</script>
