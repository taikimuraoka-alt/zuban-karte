<!doctype html><html><head><meta charset="utf-8"><title>QR gen</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>body{font-family:sans-serif;background:#fff}div.q{display:inline-block;margin:12px;padding:8px;border:1px solid #ccc}</style>
</head><body>
<div class="q" id="q1"></div><div class="q" id="q2"></div>
<script>
const BASE = location.origin + location.pathname.replace(/qrgen\.html$/, "");
window.URLS = [BASE + "#L0018G-M003", BASE + "#L0018G-M004"];
window.QRS = [new QRCode(document.getElementById("q1"), {text:window.URLS[0], width:256, height:256, correctLevel:QRCode.CorrectLevel.M}),
              new QRCode(document.getElementById("q2"), {text:window.URLS[1], width:256, height:256, correctLevel:QRCode.CorrectLevel.M})];
// matrix as hex rows for transfer: each row packed MSB-first
window.matrix = function(i){ const q = window.QRS[i]._oQRCode; const n = q.getModuleCount(); const rows=[]; for(let r=0;r<n;r++){ let bits=""; for(let c=0;c<n;c++){ bits += q.isDark(r,c)?"1":"0"; } while(bits.length%4) bits+="0"; let hex=""; for(let k=0;k<bits.length;k+=4){ hex += parseInt(bits.substr(k,4),2).toString(16); } rows.push(hex); } return {n, rows}; };
</script></body></html>
