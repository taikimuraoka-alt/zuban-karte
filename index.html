<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>図番カルテ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: one column, phone first. Lock screen → header (search + language) → one record (from #hash) or the index list. */
:root{
  --bg:#f6f7f4; --fg:#1d2420; --muted:#5d665f; --line:#d7dbd3; --card:#ffffff;
  --accent:#1f5f4a; --accent-fg:#ffffff; --soft:#e7efe9; --warn:#9a4a00; --warn-bg:#fff3e2; --bad:#9b1c1c; --bad-bg:#fde9e9;
  --sans:"Noto Sans JP","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#141916; --fg:#e8ebe6; --muted:#a3aca5; --line:#2d3630; --card:#1c231f; --accent:#7fc9a9; --accent-fg:#0d1a14; --soft:#1f2d26; --warn:#ffb974; --warn-bg:#2d2416; --bad:#ff9b9b; --bad-bg:#331a1a; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#141916; --fg:#e8ebe6; --muted:#a3aca5; --line:#2d3630; --card:#1c231f; --accent:#7fc9a9; --accent-fg:#0d1a14; --soft:#1f2d26; --warn:#ffb974; --warn-bg:#2d2416; --bad:#ff9b9b; --bad-bg:#331a1a; color-scheme:dark }
:root[lang="th"]{ --sans:"Noto Sans Thai","Noto Sans JP",system-ui,sans-serif }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.6;margin:0;padding-block:0 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:12px 0 10px;z-index:5;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.02em}
.brand small{color:var(--muted);font-size:12px;flex:1 1 auto}
.langs{display:flex;gap:4px;margin-left:auto}
.langs button{font:inherit;font-size:13px;padding:5px 10px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.search{display:flex;gap:8px}
.search input,.lock input{flex:1;min-width:0;font:inherit;font-family:var(--mono);font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
.search input:focus,.lock input:focus{outline:2px solid var(--accent);outline-offset:1px}
.search button,.lock button{font:inherit;padding:11px 16px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-fg);font-weight:500}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
main{padding-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.lock{max-width:420px;margin:48px auto 0;text-align:center}
.lock h2{font-size:18px;margin:0 0 6px}
.lock p{color:var(--muted);font-size:14px;margin:0 0 14px}
.lock form{display:flex;gap:8px}
.lock .err{color:var(--bad);font-size:13px;margin-top:10px;min-height:1.2em}
.title{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.title .no{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:.01em}
.title .name{font-size:17px;font-weight:500}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--fg)}
.chip b{font-weight:500;color:var(--muted);margin-right:4px}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:4px 0 10px;padding-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs button{flex:0 0 auto;font:inherit;font-size:15px;padding:9px 14px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{font-size:16px;margin:0 0 8px;text-wrap:balance}
h3{font-size:13px;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.kv{display:grid;grid-template-columns:minmax(90px,32%) 1fr;gap:6px 12px;font-size:14.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.price{font-family:var(--mono);font-size:28px;font-weight:600;color:var(--accent)}
.price small{font-size:13px;font-weight:400;color:var(--muted);font-family:var(--sans)}
table{border-collapse:collapse;width:100%;font-size:14px}
.tblwrap{overflow-x:auto}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12.5px}
td.num,th.num{text-align:right}
.note{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:14px}
.flow{list-style:none;margin:0;padding:0;counter-reset:step}
.flow li{position:relative;padding:0 0 14px 34px;counter-increment:step}
.flow li::before{content:counter(step);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--mono)}
.flow li::after{content:"";position:absolute;left:11px;top:26px;bottom:0;width:2px;background:var(--line)}
.flow li:last-child::after{display:none}
.flow .st{font-weight:500}.flow .sd{font-size:13.5px;color:var(--muted)}
.flow li.frame .st::after{content:attr(data-frame);font-size:11px;margin-left:8px;padding:1px 6px;border-radius:999px;background:var(--soft);color:var(--muted);font-weight:400}
.docs{display:flex;flex-direction:column;gap:14px}
.doc h4{font-size:14px;margin:0 0 6px;font-weight:500}
.doc .pages{display:flex;flex-direction:column;gap:8px}
.doc img{width:100%;max-width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff;display:block}
.doc .pagebar{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);margin-top:4px}
.doc .pagebar button{font:inherit;font-size:12.5px;padding:4px 10px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px}
.zoomwrap{overflow:auto;max-height:80vh;border-radius:6px}
.zoomwrap img.zoomed{width:200%;max-width:none}
.list{list-style:none;margin:0;padding:0}
.list li{border-bottom:1px solid var(--line)}
.list a{display:block;padding:12px 2px;color:inherit;text-decoration:none}
.list a:hover,.list a:focus-visible{background:var(--soft);outline:none}
.list .no{font-family:var(--mono);font-weight:600}
.list .why{font-size:13px;color:var(--muted)}
.list .meta{font-size:13px;color:var(--muted)}
.pill{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--muted);margin-left:6px;vertical-align:middle}
.path{font-family:var(--mono);font-size:12px;overflow-wrap:anywhere;background:var(--soft);padding:8px 10px;border-radius:6px}
.copy{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;margin-top:8px}
.back{display:inline-block;margin-bottom:10px;color:var(--accent);text-decoration:none;font-size:15px}
.empty{color:var(--muted);text-align:center;padding:28px 0}
.lockbtn{font:inherit;font-size:12px;color:var(--muted);background:none;border:0;padding:0;text-decoration:underline}
.loading{color:var(--muted);font-size:14px;padding:10px 0}
footer{color:var(--muted);font-size:12px;margin-top:20px;text-align:center}
@media (prefers-reduced-motion:no-preference){ .card{animation:in .18s ease-out} @keyframes in{from{opacity:.6;transform:translateY(3px)}to{opacity:1;transform:none}} }
</style>
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

  else h.textContent = t("lockHint");
}
document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", ()=>{ LANG = b.dataset.lang; try{ localStorage.setItem("karte.lang", LANG) }catch(e){}; applyChrome(); if(RECORDS.length) route(); else renderLock(""); }));

async function decryptBlob(e, pass){
  const te = new TextEncoder();
  const km = await crypto.subtle.importKey("raw", te.encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(e.salt), iterations:e.iter, hash:"SHA-256"}, km, {name:"AES-CBC", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-CBC", iv:b64(e.iv)}, key, b64(e.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function renderLock(msg){
  document.getElementById("form").hidden = true; applyChrome();
  main.innerHTML = `<div class="card lock"><h2>${esc(t("lockTitle"))}</h2><p>${esc(t("lockMsg"))}</p>
    <form id="lockForm"><input id="pw" type="password" autocomplete="current-password" aria-label="${esc(t("pw"))}" placeholder="${esc(t("pw"))}"><button type="submit">${esc(t("open"))}</button></form>
    <div class="err" id="err">${esc(msg||"")}</div></div>`;
  document.getElementById("lockForm").addEventListener("submit", async e => { e.preventDefault(); const pw = document.getElementById("pw").value; document.getElementById("err").textContent = t("checking"); try{ await unlock(pw); try{ localStorage.setItem("karte.pw", pw) }catch(_){} }catch(_){ document.getElementById("err").textContent = t("wrong"); } });
  setTimeout(()=>{ const p=document.getElementById("pw"); if(p) p.focus(); }, 50);
}
function lock(){ try{ localStorage.removeItem("karte.pw") }catch(_){}; PW=null; DATA=null; FLOW=[]; RECORDS=[]; byId={}; CAUTIONS=[]; FLOWDOCS=null; renderLock(""); }
async function unlock(pw){
  if(!(window.crypto && crypto.subtle)) throw new Error("no webcrypto");
  const data = await decryptBlob(ENC, pw);
  PW = pw; DATA = data; FLOW = data.flow; RECORDS = data.records; CAUTIONS = data.cautions || []; byId = Object.fromEntries(RECORDS.map(r=>[r.id,r]));
  document.getElementById("form").hidden = false; applyChrome(); route();
}
async function loadFlowDocs(){
  if(FLOWDOCS) return FLOWDOCS;
  if(!FLOW_LOADING){ FLOW_LOADING = fetch(FLOW_URL, {cache:"force-cache"}).then(r=>{ if(!r.ok) throw new Error("http "+r.status); return r.json(); }).then(e=>decryptBlob(e, PW)).then(d=>{ FLOWDOCS = d.docs; return FLOWDOCS; }).catch(err=>{ FLOW_LOADING=null; throw err; }); }
  return FLOW_LOADING;
}

function link(id){ return `#${id}` }
function listItem(r, why){
  return `<li><a href="${link(r.id)}"><span class="no">${esc(r.id)}</span> ${esc(tx(r,"name"))} <span class="pill">${esc(tx(r,"customer").split(/[（(]/)[0])}</span><div class="meta">${esc(tx(r,"finish").split(/[（(]/)[0])} ・ ${fmt(r.area)} mm² ・ <span class="num">${fmt(r.quote.price)}</span> ${esc(tx(r.quote,"unit"))} ・ ${esc(r.quote.date)}</div>${why?`<div class="why">${esc(why)}</div>`:""}</a></li>`;
}
function renderIndex(q){
  const words = (q||"").trim().toLowerCase().split(/\s+/).filter(Boolean);
  const hits = RECORDS.filter(r => !words.length || words.every(w => [r.id,r.name,r.model,r.oldNo,r.customer].join(" ").toLowerCase().includes(w)));
  main.innerHTML = `<div class="card"><h2>${words.length?t("hitN")(hits.length):t("regN")(RECORDS.length)}</h2>${hits.length?`<ul class="list">${hits.map(r=>listItem(r)).join("")}</ul>`:`<p class="empty">${esc(t("none"))}</p>`}</div>`;
}
function quotePanel(r){
  const q = r.quote, th = LANG==="th";
  const tiers = (th && q.tiers_th) ? q.tiers_th : q.tiers;
  return `<h2>${esc(t("quote"))}</h2>
    <div class="price">${fmt(q.price)} <small>${esc(tx(q,"unit"))} ・ ${esc(q.date)}${(!th && q.profit!=="—")?` ・ ${esc(t("profit"))} ${esc(q.profit)}`:""}</small></div>
    <dl class="kv" style="margin-top:10px"><dt>${esc(t("lot"))}</dt><dd>${esc(tx(q,"lot"))}</dd><dt>${esc(t("total"))}</dt><dd>${esc(tx(q,"total"))}</dd>${th?"":`<dt>${esc(t("basis"))}</dt><dd>${esc(q.basis)}</dd>`}<dt>${esc(t("book"))}</dt><dd>${esc(r.sheet)}</dd></dl>
    ${tiers.length?`<h3>${esc(t("tiers"))}</h3><div class="tblwrap"><table><tr><th>${esc(t("tierCol"))}</th><th class="num">${esc(t("perPc"))}</th></tr>${tiers.map(x=>`<tr><td>${esc(x[0])}</td><td class="num">${fmt(x[1])}</td></tr>`).join("")}</table></div>`:""}
    ${(!th && q.alt)?`<h3>${esc(t("alt"))}</h3><p class="note">${esc(q.alt)}</p>`:""}
    ${tx(q,"prev")?`<h3>${esc(t("prev"))}</h3><p class="note">${esc(tx(q,"prev"))}</p>`:""}`;
}
function flowPanel(){
  return `<h2>${esc(t("flowTitle"))}</h2><p class="sub" style="margin-bottom:10px">${esc(t("flowSub"))}</p>
    <ol class="flow">${FLOW.map(s=>`<li${s.frame?` class="frame" data-frame="${esc(t("frame"))}"`:''}><div class="st">${esc(tx(s,"st"))}</div><div class="sd">${esc(tx(s,"sd"))}</div></li>`).join("")}</ol>
    <p class="note">${esc(t("flowNote"))}</p>
    <h3>${esc(t("docsTitle"))}</h3><p class="sub" style="margin-bottom:8px">${esc(t("docsSub"))}</p><div id="docs" class="docs"><div class="loading">${esc(t("loading"))}</div></div>`;
}
function renderDocs(){
  const box = document.getElementById("docs"); if(!box) return;
  loadFlowDocs().then(docs=>{ const b = document.getElementById("docs"); if(!b) return;
    b.innerHTML = docs.map((d,i)=>`<div class="doc" data-doc="${i}"><h4>${esc(d.title[LANG]||d.title.ja)}</h4><div class="pages">${d.pages.map((p,j)=>`<div><div class="zoomwrap"><img src="${p}" alt="${esc(d.title.en||d.id)} p${j+1}" loading="lazy"></div><div class="pagebar"><span>${esc(t("page"))} ${j+1}/${d.pages.length}</span><button type="button" class="zoombtn">${esc(t("zoom"))}</button></div></div>`).join("")}</div></div>`).join("");
    b.querySelectorAll(".zoombtn").forEach(btn=>btn.addEventListener("click",()=>{ const img = btn.closest("div").previousElementSibling.querySelector("img"); const z = img.classList.toggle("zoomed"); btn.textContent = z ? t("unzoom") : t("zoom"); }));
  }).catch(()=>{ const b = document.getElementById("docs"); if(b) b.innerHTML = `<p class="note">${esc(t("loadFail"))}</p>`; });
}
function renderRecord(r){
  const th = LANG==="th";
  const panels = {
    quote: quotePanel(r),
    flow: flowPanel(),
    issues: `<h2>${esc(t("issuesTitle"))}</h2>${r.issues.length?`<ul class="list">${r.issues.map(i=>`<li><div>${esc(i)}</div></li>`).join("")}</ul>`:`<p class="note">${esc(tx(r,"issuesNote"))}</p>`}
      <h3>${esc(t("cautions"))}</h3><ul style="margin:0;padding-left:18px;font-size:14.5px">${CAUTIONS.map(c=>`<li>${esc(th?c.th:c.ja)}</li>`).join("")}</ul>`,
    similar: `<h2>${esc(t("simTitle"))}</h2><p class="sub" style="margin-bottom:8px">${esc(t("simSub"))}</p>
      <ul class="list">${(r.similar||[]).map(s=>byId[s[0]]?listItem(byId[s[0]], (th && s[2]) ? s[2] : s[1]):"").join("")}</ul>`,
    where: `<h2>${esc(t("whereTitle"))}</h2>
      <dl class="kv"><dt>${esc(t("received"))}</dt><dd>${esc(r.received)}</dd><dt>${esc(t("rev"))}</dt><dd>${esc(r.rev||"—")}</dd><dt>${esc(t("oldNo"))}</dt><dd>${esc(r.oldNo||"—")}</dd><dt>${esc(t("areaF"))}</dt><dd class="num">${esc(r.areaFormula||"—")}</dd><dt>${esc(t("book"))}</dt><dd>${esc(r.sheet)}</dd></dl>
      <h3>${esc(t("pdf"))}</h3><div class="path" id="path">${esc(r.folder)}</div><button class="copy" type="button" id="copyBtn">${esc(t("copy"))}</button>`
  };
  const tabs = ["quote","flow","issues","similar","where"];
  main.innerHTML = `<a class="back" href="#">${esc(t("back"))}</a>
    <div class="card"><div class="title"><span class="no">${esc(r.id)}</span><span class="name">${esc(tx(r,"name"))}</span></div>
      <div class="sub">${esc(tx(r,"customer"))} ・ ${esc(t("model"))} ${esc(r.model)}${r.oldNo?` ・ ${esc(t("old"))} ${esc(r.oldNo)}`:""}</div>
      <div class="chips"><span class="chip"><b>${esc(t("chips").material)}</b>${esc(r.material)}</span><span class="chip"><b>${esc(t("chips").finish)}</b>${esc(tx(r,"finish"))}</span><span class="chip"><b>${esc(t("chips").thickness)}</b>${esc(r.thickness)}</span><span class="chip"><b>${esc(t("chips").size)}</b>${esc(r.size)}</span><span class="chip"><b>${esc(t("chips").area)}</b>${fmt(r.area)} mm²</span><span class="chip"><b>${esc(t("chips").masking)}</b>${esc(tx(r,"masking"))}</span></div></div>
    <div class="tabs" role="tablist">${tabs.map(k=>`<button role="tab" data-tab="${k}" aria-selected="${k===tab}">${esc(t("tabs")[k])}</button>`).join("")}</div>
    <div class="card" id="panel">${panels[tab]||panels.quote}</div>`;
  main.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{ tab=b.dataset.tab; try{localStorage.setItem("karte.tab",tab)}catch(e){}; renderRecord(r); }));
  if(tab==="flow") renderDocs();
  const cb = document.getElementById("copyBtn");
  if(cb) cb.addEventListener("click",()=>{ const txt=document.getElementById("path").textContent; navigator.clipboard.writeText(txt).then(()=>{cb.textContent=t("copied")}).catch(()=>{ const s=window.getSelection(), rg=document.createRange(); rg.selectNodeContents(document.getElementById("path")); s.removeAllRanges(); s.addRange(rg); cb.textContent=t("selected"); }); });
}
function route(){
  if(!RECORDS.length) return;
  const id = decodeURIComponent(location.hash.slice(1));
  const r = byId[id];
  if(r){ document.getElementById("q").value = r.id; renderRecord(r); window.scrollTo(0,0); }
  else { renderIndex(document.getElementById("q").value); }
}
document.getElementById("form").addEventListener("submit",e=>{ e.preventDefault(); const v=document.getElementById("q").value.trim(); const exact=RECORDS.find(r=>r.id.toLowerCase()===v.toLowerCase()); if(exact){ location.hash=exact.id; } else { if(location.hash) history.replaceState(null,"",location.pathname); renderIndex(v); } });
document.getElementById("q").addEventListener("input",e=>{ if(!location.hash) renderIndex(e.target.value); });
window.addEventListener("hashchange",route);
(async()=>{ applyChrome(); let saved=null; try{ saved = localStorage.getItem("karte.pw") }catch(e){}
  if(saved){ try{ await unlock(saved); return; }catch(e){ try{ localStorage.removeItem("karte.pw") }catch(_){} } }
  renderLock(""); })();
</script>

</body>
