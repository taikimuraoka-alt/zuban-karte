<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>図番カルテ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: one column, phone first. Lock screen → header = search; body = one record (from #hash) or the index list. */
:root{
  --bg:#f6f7f4; --fg:#1d2420; --muted:#5d665f; --line:#d7dbd3; --card:#ffffff;
  --accent:#1f5f4a; --accent-fg:#ffffff; --soft:#e7efe9; --warn:#9a4a00; --warn-bg:#fff3e2; --bad:#9b1c1c; --bad-bg:#fde9e9;
  --sans:"Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#141916; --fg:#e8ebe6; --muted:#a3aca5; --line:#2d3630; --card:#1c231f; --accent:#7fc9a9; --accent-fg:#0d1a14; --soft:#1f2d26; --warn:#ffb974; --warn-bg:#2d2416; --bad:#ff9b9b; --bad-bg:#331a1a; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#141916; --fg:#e8ebe6; --muted:#a3aca5; --line:#2d3630; --card:#1c231f; --accent:#7fc9a9; --accent-fg:#0d1a14; --soft:#1f2d26; --warn:#ffb974; --warn-bg:#2d2416; --bad:#ff9b9b; --bad-bg:#331a1a; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;margin:0;padding-block:0 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:12px 0 10px;z-index:5;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.02em}
.brand small{color:var(--muted);font-size:12px}
.search{display:flex;gap:8px}
.search input,.lock input{flex:1;min-width:0;font:inherit;font-family:var(--mono);font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
.search input:focus,.lock input:focus{outline:2px solid var(--accent);outline-offset:1px}
.search button,.lock button{font:inherit;padding:11px 16px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-fg);font-weight:500}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
main{padding-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.lock{max-width:420px;margin:48px auto 0;text-align:center}
.lock h2{font-size:18px;margin:0 0 6px}
.lock p{color:var(--muted);font-size:14px;margin:0 0 14px}
.lock form{display:flex;gap:8px}
.lock .err{color:var(--bad);font-size:13px;margin-top:10px;min-height:1.2em}
.title{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.title .no{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:.01em}
.title .name{font-size:17px;font-weight:500}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--fg)}
.chip b{font-weight:500;color:var(--muted);margin-right:4px}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:4px 0 10px;padding-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs button{flex:0 0 auto;font:inherit;font-size:15px;padding:9px 14px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{font-size:16px;margin:0 0 8px;text-wrap:balance}
h3{font-size:13px;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.kv{display:grid;grid-template-columns:minmax(90px,32%) 1fr;gap:6px 12px;font-size:14.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.price{font-family:var(--mono);font-size:28px;font-weight:600;color:var(--accent)}
.price small{font-size:13px;font-weight:400;color:var(--muted);font-family:var(--sans)}
table{border-collapse:collapse;width:100%;font-size:14px}
.tblwrap{overflow-x:auto}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12.5px}
td.num,th.num{text-align:right}
.note{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:14px}
.flow{list-style:none;margin:0;padding:0;counter-reset:step}
.flow li{position:relative;padding:0 0 14px 34px;counter-increment:step}
.flow li::before{content:counter(step);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--mono)}
.flow li::after{content:"";position:absolute;left:11px;top:26px;bottom:0;width:2px;background:var(--line)}
.flow li:last-child::after{display:none}
.flow .st{font-weight:500}.flow .sd{font-size:13.5px;color:var(--muted)}
.flow li.frame .st::after{content:"枠工程";font-size:11px;margin-left:8px;padding:1px 6px;border-radius:999px;background:var(--soft);color:var(--muted);font-weight:400}
.list{list-style:none;margin:0;padding:0}
.list li{border-bottom:1px solid var(--line)}
.list a{display:block;padding:12px 2px;color:inherit;text-decoration:none}
.list a:hover,.list a:focus-visible{background:var(--soft);outline:none}
.list .no{font-family:var(--mono);font-weight:600}
.list .why{font-size:13px;color:var(--muted)}
.list .meta{font-size:13px;color:var(--muted)}
.pill{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--muted);margin-left:6px;vertical-align:middle}
.path{font-family:var(--mono);font-size:12px;overflow-wrap:anywhere;background:var(--soft);padding:8px 10px;border-radius:6px}
.copy{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;margin-top:8px}
.back{display:inline-block;margin-bottom:10px;color:var(--accent);text-decoration:none;font-size:15px}
.empty{color:var(--muted);text-align:center;padding:28px 0}
.lockbtn{font:inherit;font-size:12px;color:var(--muted);background:none;border:0;padding:0;text-decoration:underline}
footer{color:var(--muted);font-size:12px;margin-top:20px;text-align:center}
@media (prefers-reduced-motion:no-preference){ .card{animation:in .18s ease-out} @keyframes in{from{opacity:.6;transform:translateY(3px)}to{opacity:1;transform:none}} }
</style>
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>

let FLOW = [], RECORDS = [], byId = {};
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => typeof n==="number" ? n.toLocaleString("ja-JP",{maximumFractionDigits:2}) : esc(n);
const main = document.getElementById("main");
let tab = "quote";
try{ tab = localStorage.getItem("karte.tab") || tab }catch(e){}
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function decrypt(pass){
  const te = new TextEncoder();
  const km = await crypto.subtle.importKey("raw", te.encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(ENC.salt), iterations:ENC.iter, hash:"SHA-256"}, km, {name:"AES-CBC", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-CBC", iv:b64(ENC.iv)}, key, b64(ENC.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function renderLock(msg){
  document.getElementById("form").hidden = true;
  document.getElementById("hint").textContent = "このページは社内専用です。パスワードを入れると開きます（この端末では次回から省略）。";
  main.innerHTML = `<div class="card lock"><h2>パスワード</h2><p>社内担当者から受け取ったパスワードを入力してください。</p>
    <form id="lockForm"><input id="pw" type="password" autocomplete="current-password" inputmode="text" aria-label="パスワード" placeholder="パスワード"><button type="submit">開く</button></form>
    <div class="err" id="err">${esc(msg||"")}</div></div>`;
  const f = document.getElementById("lockForm");
  f.addEventListener("submit", async e => { e.preventDefault(); const pw = document.getElementById("pw").value; document.getElementById("err").textContent = "確認中…"; try{ await unlock(pw); try{ localStorage.setItem("karte.pw", pw) }catch(_){} }catch(_){ document.getElementById("err").textContent = "パスワードが違います。"; } });
  setTimeout(()=>{ const p=document.getElementById("pw"); if(p) p.focus(); }, 50);
}
async function unlock(pw){
  if(!(window.crypto && crypto.subtle)) throw new Error("no webcrypto");
  const data = await decrypt(pw);
  FLOW = data.flow; RECORDS = data.records; byId = Object.fromEntries(RECORDS.map(r=>[r.id,r]));
  document.getElementById("form").hidden = false;
  document.getElementById("hint").innerHTML = `図面のQRを読むと、その図番のページが直接開きます。 <button type="button" class="lockbtn" id="lockBtn">ロックする</button>`;
  document.getElementById("lockBtn").addEventListener("click", ()=>{ try{ localStorage.removeItem("karte.pw") }catch(_){}; FLOW=[]; RECORDS=[]; byId={}; renderLock(""); });
  route();
}

function link(id){ return `#${id}` }
function listItem(r, why){
  return `<li><a href="${link(r.id)}"><span class="no">${esc(r.id)}</span> ${esc(r.name)} <span class="pill">${esc(r.customer.split("（")[0])}</span><div class="meta">${esc(r.finish.split("（")[0])} ・ ${fmt(r.area)} mm² ・ <span class="num">${fmt(r.quote.price)}</span> ${esc(r.quote.unit)} ・ ${esc(r.quote.date)}</div>${why?`<div class="why">${esc(why)}</div>`:""}</a></li>`;
}
function renderIndex(q){
  const words = (q||"").trim().toLowerCase().split(/\s+/).filter(Boolean);
  const hits = RECORDS.filter(r => !words.length || words.every(w => [r.id,r.name,r.model,r.oldNo,r.customer].join(" ").toLowerCase().includes(w)));
  main.innerHTML = `<div class="card"><h2>${words.length?`検索結果 ${hits.length} 件`:`登録図番 ${RECORDS.length} 件`}</h2>${hits.length?`<ul class="list">${hits.map(r=>listItem(r)).join("")}</ul>`:`<p class="empty">該当なし。図番の一部（例 L0018G、HLB454、SIDE PLATE）で探してください。</p>`}</div>`;
}

    flow: `<h2>工程フロー（FF Black・見積前提の標準フロー）</h2>
      <p class="sub" style="margin-bottom:10px">枠工程は 1 回あたりの時間。個別工程は 1 個あたり。工程順は現場の指示書を優先してください。</p>
      <ol class="flow">${FLOW.map(s=>`<li${s.frame?' class="frame"':''}><div class="st">${esc(s.st)}</div><div class="sd">${esc(s.sd)}</div></li>`).join("")}</ol>
      <p class="note">枠工程 合計 4,080 秒/回（準備 5 ＋ ホイスト 35 ＋ シャワー 5 ＋ 移動 5 ＋ LINE4 往復 3 ＋ FF 5 ＋ 管理 10 分）。個別 24 秒/個。混載なら枠工程はその回の合計個数で按分。</p>`,
    issues: `<h2>問題・クレーム履歴</h2>${r.issues.length?`<ul class="list">${r.issues.map(i=>`<li><div>${esc(i)}</div></li>`).join("")}</ul>`:`<p class="note">${esc(r.issuesNote)}</p>`}
      <h3>この仕上げで注意する点</h3><ul style="margin:0;padding-left:18px;font-size:14.5px"><li>FF Black 小物は検査秒数を実測で確認（8 秒前提、JWS 実測 26 秒）</li><li>タップ穴は後加工なのでマスキング不要。ねじ山にアルマイトが乗る指示ではない</li><li>枠工程 734 B/回（利益 10 % 時）は、その回に一緒に流す個数で按分される。少量単独なら単価が大きく上がる</li></ul>`,
    similar: `<h2>似ている図面</h2><p class="sub" style="margin-bottom:8px">同モデル・同設計元・同仕上・同サイズ帯から抽出。価格は当時の提示値。</p>
      <ul class="list">${(r.similar||[]).map(([id,why])=>byId[id]?listItem(byId[id],why):"").join("")}</ul>`,
    where: `<h2>保管場所・図面情報</h2>
      <dl class="kv"><dt>入手日</dt><dd>${esc(r.received)}</dd><dt>リビジョン</dt><dd>${esc(r.rev||"—")}</dd><dt>旧図番</dt><dd>${esc(r.oldNo||"—")}</dd><dt>面積式</dt><dd class="num">${esc(r.areaFormula||"—")}</dd><dt>見積ブック</dt><dd>${esc(r.sheet)}</dd></dl>
      <h3>図面 PDF</h3><div class="path" id="path">${esc(r.folder)}</div><button class="copy" type="button" id="copyBtn">パスをコピー</button>`
  };
  const tabs = [["quote","見積"],["flow","フロー"],["issues","問題履歴"],["similar","類似図面"],["where","保管場所"]];
  main.innerHTML = `<a class="back" href="#">← 一覧へ</a>
    <div class="card"><div class="title"><span class="no">${esc(r.id)}</span><span class="name">${esc(r.name)}</span></div>
      <div class="sub">${esc(r.customer)} ・ MODEL ${esc(r.model)}${r.oldNo?` ・ 旧 ${esc(r.oldNo)}`:""}</div>
      <div class="chips"><span class="chip"><b>材質</b>${esc(r.material)}</span><span class="chip"><b>仕上</b>${esc(r.finish)}</span><span class="chip"><b>膜厚</b>${esc(r.thickness)}</span><span class="chip"><b>寸法</b>${esc(r.size)}</span><span class="chip"><b>面積</b>${fmt(r.area)} mm²</span><span class="chip"><b>マスキング</b>${esc(r.masking)}</span></div></div>
    <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${k===tab}">${l}</button>`).join("")}</div>
    <div class="card" id="panel">${panels[tab]||panels.quote}</div>`;
  main.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{ tab=b.dataset.tab; try{localStorage.setItem("karte.tab",tab)}catch(e){}; renderRecord(r); }));
  const cb = document.getElementById("copyBtn");
  if(cb) cb.addEventListener("click",()=>{ const t=document.getElementById("path").textContent; navigator.clipboard.writeText(t).then(()=>{cb.textContent="コピーしました"}).catch(()=>{ const s=window.getSelection(), rg=document.createRange(); rg.selectNodeContents(document.getElementById("path")); s.removeAllRanges(); s.addRange(rg); cb.textContent="選択しました"; }); });
}
function route(){
  if(!RECORDS.length) return;
  const id = decodeURIComponent(location.hash.slice(1));
  const r = byId[id];
  if(r){ document.getElementById("q").value = r.id; renderRecord(r); window.scrollTo(0,0); }
  else { renderIndex(document.getElementById("q").value); }
}
document.getElementById("form").addEventListener("submit",e=>{ e.preventDefault(); const v=document.getElementById("q").value.trim(); const exact=RECORDS.find(r=>r.id.toLowerCase()===v.toLowerCase()); if(exact){ location.hash=exact.id; } else { if(location.hash) history.replaceState(null,"",location.pathname); renderIndex(v); } });
document.getElementById("q").addEventListener("input",e=>{ if(!location.hash) renderIndex(e.target.value); });
window.addEventListener("hashchange",route);
(async()=>{ let saved=null; try{ saved = localStorage.getItem("karte.pw") }catch(e){}
  if(saved){ try{ await unlock(saved); return; }catch(e){ try{ localStorage.removeItem("karte.pw") }catch(_){} } }
  renderLock(""); })();
</script>

</body>
</html>
